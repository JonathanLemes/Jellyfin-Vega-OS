schema-version = 1

[package]
title = "Jellyfin"
version = "0.1.0"
id = "com.jonathanlemes.jellyfinvega"
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

# The [needs.module] entries below are regenerated from package.json by the
# Kepler manifest builder on every `vega build`; edit dependencies there.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.kepler_file_system_0@IKeplerFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_system_info_1@IKeplerSystemInfo_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.expo_file_system_2@IExpoFileSystem_0"

[[needs.module]]
id = "/com.amazon.kepler.expo_sqlite_2@IExpoSQLite_0"

[[needs.module]]
id = "/com.amazon.kepler.kepler_identifiers_0@IKeplerIdentifiers_0"




[wants]
# Required for <TextInput> to reach the on-screen keyboard. Without it a focused
# field never opens the keyboard, and the only clue is
# "InputMethodEditorImpl: no active connection to input method service" in the
# device log -- not a permission error.
[[wants.service]]
id = "com.amazon.inputmethod.service"

# The media services below are what let the W3C Media player actually create a
# decoder. Omitting any of them does not surface as a permission error either:
# the player reports a generic failure to attach.
[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[components]
[[components.interactive]]
id = "com.jonathanlemes.jellyfinvega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
